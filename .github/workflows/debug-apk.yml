name: Build Debug APK (on demand)

# Manual, secrets-free debug APK build for local testing on a real device.
# Unlike android-e2e.yml (which builds an x86_64 debug APK for the emulator
# and never persists it) and nightly.yml/release.yml (which need signing and
# publishing secrets that only exist on the upstream repo), this workflow
# just builds an aarch64 debug APK and uploads it as a downloadable Actions
# artifact. No emulator, no signing, no release secrets required.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: build debug APK (arm64-v8a)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/readest-app
          # Only the customized files of gen/android are tracked — regenerate
          # the gradle scaffolding, then restore the tracked customizations
          # (same flow as android-e2e.yml / release.yml).
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          # Debug build: signed with the debug keystore, no release secrets
          # needed (gradle only loads keystore.properties when it exists).
          pnpm tauri android build --debug --target aarch64
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' | head -n 1)
          echo "APK=$PWD/$APK" >> "$GITHUB_ENV"
          test -n "$APK"

      - name: upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-debug-arm64
          path: ${{ env.APK }}
          retention-days: 14
